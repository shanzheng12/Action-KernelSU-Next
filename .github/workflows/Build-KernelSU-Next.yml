name: Build KernelSU-Next for OnePlus 5T

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install git build-essential libssl-dev libelf-dev bison flex bc python3 cpio unzip wget -y

    - name: Setup toolchain
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
        echo "PATH=$PWD/aarch64-linux-android-4.9/bin:$PATH" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV

    - name: Clone kernel source (OnePlus 5T Android 10)
      run: |
        git clone --depth=1 -b lineage-17.1 https://github.com/LineageOS/android_kernel_oneplus_msm8998.git kernel
        cd kernel

    - name: Integrate KernelSU-Next
      run: |
        cd kernel
        git clone https://github.com/rifsxd/KernelSU-Next.git KernelSU
        echo "source \"KernelSU/Kconfig\"" >> Kconfig
        echo "obj-\$(CONFIG_KSU) += KernelSU/" >> Makefile

    - name: Build kernel
      run: |
        cd kernel
        make lineageos_oneplus5t_defconfig
        # 开启KernelSU、kprobe、调试支持
        scripts/config --enable CONFIG_KSU
        scripts/config --enable CONFIG_KPROBES
        scripts/config --enable CONFIG_MODULES
        scripts/config --enable CONFIG_DEBUG_FS
        scripts/config --enable CONFIG_KALLSYMS
        make olddefconfig
        make -j$(nproc)

    - name: Pack boot.img
      run: |
        cd kernel
        wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
        unzip Magisk-v27.0.apk -d magisk
        cp magisk/lib/x86_64/magiskboot ./
        chmod +x magiskboot
        
        # 这里用通用boot打包方式，产出内核镜像
        echo "Kernel compiled at arch/arm64/boot/Image.gz-dtb"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: OnePlus5T-KernelSU-Next
        path: kernel/arch/arm64/boot/Image.gz-dtb
