name: Build KernelSU-Next for OnePlus 5T

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies & cross compilers
      run: |
        sudo apt update
        sudo apt install git build-essential libssl-dev libelf-dev bison flex bc python3 cpio unzip wget curl -y
        # 安装64位+32位交叉编译器，系统全局可用，无需手动配置路径
        sudo apt install gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi -y

    - name: Clone kernel source
      run: |
        git clone --depth=1 -b lineage-17.1 https://github.com/LineageOS/android_kernel_oneplus_msm8998.git kernel

    - name: Integrate KernelSU-Next
      run: |
        cd kernel
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -s next

    - name: Build kernel
      run: |
        cd kernel
        # 直接在当前步骤设置编译环境，避免跨步骤传递失效
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        make lineage_oneplus5_defconfig
        make -j$(nproc)

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus5T-KernelSU-Next
        path: kernel/arch/arm64/boot/Image.gz-dtb
