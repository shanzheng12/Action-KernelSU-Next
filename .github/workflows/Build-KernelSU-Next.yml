name: Build KernelSU-Next for OnePlus 5T

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install git build-essential libssl-dev libelf-dev bison flex bc python3 cpio unzip wget curl -y

    - name: Setup toolchain
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
        echo "PATH=$GITHUB_WORKSPACE/aarch64-linux-android-4.9/bin:$PATH" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV

    - name: Clone kernel source (OnePlus 5T Android 10)
      run: |
        git clone --depth=1 -b lineage-17.1 https://github.com/LineageOS/android_kernel_oneplus_msm8998.git kernel

    - name: Auto integrate KernelSU-Next (官方脚本自动处理路径)
      run: |
        cd kernel
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -s next

    - name: Build kernel
      run: |
        cd kernel
        make lineage_dumpling_defconfig
        make -j$(nproc)

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus5T-KernelSU-Next
        path: kernel/arch/arm64/boot/Image.gz-dtb
