name: Build Kernel for OnePlus 5T (Base Test)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install git build-essential libssl-dev libelf-dev bison flex bc python3 cpio unzip wget curl -y

    - name: Setup toolchain
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
        echo "PATH=$GITHUB_WORKSPACE/aarch64-linux-android-4.9/bin:$PATH" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV

    - name: Clone kernel source
      run: |
        git clone --depth=1 -b lineage-17.1 https://github.com/LineageOS/android_kernel_oneplus_msm8998.git kernel

    - name: List available defconfigs
      run: |
        cd kernel
        echo "=== 所有一加相关配置文件 ==="
        ls arch/arm64/configs/ | grep -E "oneplus|dumpling|cheeseburger|lineage|msm8998"

    - name: Upload config list
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: defconfig-list
        path: kernel/arch/arm64/configs/
